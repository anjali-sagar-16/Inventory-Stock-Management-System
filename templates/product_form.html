{% extends "base.html" %}
{% block title %}{{ 'Edit' if editing else 'New' }} product{% endblock %}
{% block content %}
<section class="card narrow">
<h1>{{ 'Edit' if editing else 'New' }} product</h1>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Name * <input name="product_name" required maxlength="200" value="{{ product['product_name'] if product else '' }}"></label>
  <label>Product code (optional, unique) <input name="product_code" value="{{ product['product_code'] or '' if product else '' }}"></label>
  <label>Description <textarea name="description" rows="2">{{ product['description'] or '' if product else '' }}</textarea></label>
  <label>Unit price <input name="unit_price" type="number" step="0.01" min="0" value="{{ product['unit_price'] if product and product['unit_price'] is not none else '' }}"></label>
  <label>Reorder level <input name="reorder_level" type="number" step="1" min="0" value="{{ product['reorder_level'] if product else 0 }}"></label>
  <label>Supplier
    <select name="supplier_id"><option value="">— none —</option>
    {% for s in suppliers %}<option value="{{ s['supplier_id'] }}" {% if product and product['supplier_id']|string == s['supplier_id']|string %}selected{% endif %}>{{ s['supplier_name'] }}</option>{% endfor %}
    </select></label>
  {% if not editing %}<p class="muted">Quantity starts at 0. Record opening stock with Stock-In.</p>{% endif %}
  <button class="btn" type="submit">Save</button> <a class="btn secondary" href="{{ url_for('catalog.products') }}">Cancel</a>
</form></section>
{% endblock %}
