{% extends "base.html" %}
{% block title %}New sale{% endblock %}
{% block content %}
<h1>New sale</h1>
<form method="post" id="sale-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <table id="lines">
    <thead><tr><th>Product</th><th class="num">Unit price</th><th class="num">Qty</th><th class="num">Line total</th><th></th></tr></thead>
    <tbody>
    {% for pid, qty in (submitted or [('', '')]) %}
    <tr class="line">
      <td><select name="product_id" required><option value="">— select —</option>
        {% for p in products %}<option value="{{ p['product_id'] }}" data-price="{{ p['unit_price'] if p['unit_price'] is not none else '' }}" {% if pid|string == p['product_id']|string %}selected{% endif %}>{{ p['product_name'] }} (in stock: {{ p['quantity'] }}{% if p['unit_price'] is none %}, no price{% endif %})</option>{% endfor %}
      </select></td>
      <td class="num price">—</td>
      <td class="num"><input name="quantity" type="number" min="1" step="1" required value="{{ qty }}"></td>
      <td class="num line-total">—</td>
      <td><button type="button" class="btn small danger remove-line">Remove</button></td>
    </tr>
    {% endfor %}
    </tbody>
    <tfoot><tr><th colspan="3" class="num">Estimated total (server recalculates)</th><th class="num" id="grand">0.00</th><th></th></tr></tfoot>
  </table>
  <button type="button" class="btn secondary" id="add-line">+ Add line</button>
  <button class="btn" type="submit">Complete sale</button>
  <a class="btn secondary" href="{{ url_for('sales.sales_list') }}">Cancel</a>
</form>
{% endblock %}
